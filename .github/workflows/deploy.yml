name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Allows the validator workflow to redeploy after auto-merging a move PR.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Vite inlines VITE_* env vars at build time, so they must be on the
      # process when `vite build` runs. Repo secrets are exposed via env here.
      - run: npm run build
        env:
          VITE_GITHUB_CLIENT_ID: ${{ secrets.VITE_GITHUB_CLIENT_ID }}
          VITE_OAUTH_WORKER_URL: ${{ secrets.VITE_OAUTH_WORKER_URL }}
          VITE_GITHUB_REPO: ${{ secrets.VITE_GITHUB_REPO }}

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: theatrum.kaungmyatthu.dev
