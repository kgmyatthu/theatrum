name: Validate and auto-merge moves

# pull_request_target runs in the BASE repo's trusted context with access
# to GITHUB_TOKEN write perms. The PR head is checked out READ-ONLY —
# we never execute code from it.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - 'public/data/state.json'
      - 'public/data/turn.json'
      - 'public/data/perm.json'
      - 'public/data/forces/**'

permissions:
  contents: write
  pull-requests: write

# Per-PR. A global group looks tempting now that the recruitment cap is a
# SUM over a nation's forces — unlike every per-force check it is not
# invariant to what else is in flight, so two PRs validated against the
# same main can each be inside the cap and still exceed it once both land.
# But GitHub's concurrency queue is exactly one deep: with a run in
# progress, a THIRD arrival cancels the PENDING one outright, and
# cancel-in-progress: false only protects the run already going. A burst of
# three submissions would silently drop the middle PR — never validated,
# never merged, never commented on, and with no further event to retrigger
# it, since the worker pushes a submission branch exactly once. Losing a
# player's move outright is worse than the race, which needs two players
# sharing one nation (perm.json allows it) submitting close enough
# together that both merge refs predate the other's merge.
# ponytail: if that race ever bites, the fix is a real queue — a merge
# train triggered on push to main that picks up the next open PR — not a
# wider concurrency group, which cannot express "queue" at all.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base (main, trusted)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: base

      # The MERGE ref, not the PR head: what this PR would actually produce
      # on main, which is what the nation-level sums have to be scored
      # against. Scoring head.sha lets two concurrent PRs each pass their own
      # cap check and still combine past it on merge. Still untrusted data —
      # the validator itself runs from base/ and never executes anything here.
      # GitHub computes this ref asynchronously and omits it entirely for an
      # unmergeable PR, so a conflicted PR fails at this step instead of
      # reaching the validator's own "merge conflict against main" message.
      - name: Checkout merge result (PR + main, untrusted — read only)
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          path: head

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate move
        id: validate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # Validator script comes from BASE — never from HEAD — so a malicious
        # PR can't ship a "valid: always true" validator.
        run: node base/scripts/validate-move.mjs

      - name: Comment rejection
        if: steps.validate.outputs.valid == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          REASON: ${{ steps.validate.outputs.reason }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$REPO" \
            --body "Move rejected by validator: $REASON"

      - name: Merge approved move
        if: steps.validate.outputs.valid == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr merge "$PR_NUMBER" --repo "$REPO" --squash --delete-branch

      # No deploy dispatch: the frontend reads state.json live from
      # raw.githubusercontent.com on every load, so the merge lands
      # in main and clients pick it up next refresh — no Pages rebuild
      # needed (saves CI minutes).
